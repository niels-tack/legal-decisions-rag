[project]
name = "legal-decisions-rag"
version = "0.1.0"
description = "Searchable website for Belgian Constitutional Court rulings, with a built-in handoff into the user's own AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
    "requests>=2.33.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "pymupdf>=1.28.2",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "urllib3>=2.7.0",
]

# Phase 2 only (src/indexing/embeddings.py, add_embeddings(), and the query
# service's query-time embedding): sentence-transformers pulls in torch and,
# on most platforms, nvidia CUDA packages - multiple GB that Phase 1
# workflows (ingestion, build_index, build_site, the frontend's dev data,
# plain `uv sync`/`uv run`) never need and shouldn't be forced to install.
# Install explicitly with `uv sync --extra embeddings` or
# `uv run --extra embeddings ...` when you actually need real embeddings -
# see the justfile's `add-embeddings`/`backend-dev`/`fullstack-dev` recipes.
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]

[tool.pytest.ini_options]
# v2/ holds deferred functionality that isn't part of the active build (see
# v2/README.md) - excluded here so it's never picked up by plain test
# discovery even though it lives inside this repo.
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pip-audit>=2.9.1",
    "pytest>=8.4.2",
    "ruff>=0.5.7",
    "ty>=0.0.1a24",
]


######################################## Ruff configuration ########################################
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
src = ["src"]
extend-exclude = ["reference", "v2"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Be strict on application code, but relax a few common patterns in tests.
"tests/**" = [
    "B011", # assert-false (tests legitimately use asserts)
    "B018", # useless-expression (pytest patterns / doc-style expressions)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"


######################################## Ty configuration ########################################
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = [
    "src",
    "tests",
]

[tool.ty.rules]
unresolved-reference = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
unresolved-reference = "error"
unresolved-attribute = "error"
unresolved-import = "error"

[[tool.ty.overrides]]
# sentence-transformers is an optional extra (pyproject.toml's
# [project.optional-dependencies], not installed by plain `uv sync`) -
# embeddings.py's only use of it is the single lazy, deliberately-optional
# import in _get_model(). More specific than the src/** override above, so
# it takes precedence for this one file.
include = ["src/indexing/embeddings.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["examples/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unsupported-operator = "ignore"

[[tool.ty.overrides]]
include = ["deployment/**"]

[tool.ty.overrides.rules]
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
